<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#14141f" />
    </linearGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="neon-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8892b0" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d4ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e" />
    </marker>
  </defs>

  <style>
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 48px; font-weight: 800; fill: #ffffff; letter-spacing: 2px; }
    .text-subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: 500; fill: #8892b0; letter-spacing: 1px; }
    .layer-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #e2e8f0; letter-spacing: 2px; text-transform: uppercase; }
    .box-text { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; }
    .box-subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 400; fill: #94a3b8; }
    
    .layer-bg { fill: rgba(30, 41, 59, 0.4); stroke: rgba(148, 163, 184, 0.1); stroke-width: 2; rx: 16; }
    
    .box-blue { fill: url(#neon-blue); stroke: #00d4ff; stroke-width: 2; rx: 8; }
    .box-purple { fill: url(#neon-purple); stroke: #a855f7; stroke-width: 2; rx: 8; }
    .box-green { fill: url(#neon-green); stroke: #22c55e; stroke-width: 2; rx: 8; }
    .box-orange { fill: url(#neon-orange); stroke: #f97316; stroke-width: 2; rx: 8; }
    
    .path-line { fill: none; stroke: #8892b0; stroke-width: 3; stroke-dasharray: 6,4; marker-end: url(#arrow); }
    .path-blue { fill: none; stroke: #00d4ff; stroke-width: 3; marker-end: url(#arrow-blue); filter: url(#glow-blue); }
    .path-purple { fill: none; stroke: #a855f7; stroke-width: 3; marker-end: url(#arrow-purple); filter: url(#glow-purple); }
    .path-green { fill: none; stroke: #22c55e; stroke-width: 3; marker-end: url(#arrow-green); filter: url(#glow-green); }
  </style>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />
  <rect width="1920" height="1080" fill="none" stroke="rgba(0, 212, 255, 0.1)" stroke-width="4" />

  <!-- Header -->
  <text x="960" y="80" class="text-title" text-anchor="middle" filter="url(#glow-blue)">GraphMind Architecture</text>
  <text x="960" y="120" class="text-subtitle" text-anchor="middle">CodeGraphX: Multi-Tier Knowledge Graph &amp; RAG System</text>

  <!-- ================= LAYERS ================= -->

  <!-- LAYER 1: INPUT LAYER -->
  <rect x="80" y="200" width="240" height="660" class="layer-bg" />
  <text x="200" y="240" class="layer-title" text-anchor="middle">Input Layer</text>

  <rect x="100" y="300" width="200" height="80" class="box-blue" />
  <text x="200" y="335" class="box-text" text-anchor="middle">ZIP Upload</text>
  <text x="200" y="360" class="box-subtext" text-anchor="middle">Source Archive</text>

  <rect x="100" y="420" width="200" height="80" class="box-blue" />
  <text x="200" y="455" class="box-text" text-anchor="middle">GitHub Clone</text>
  <text x="200" y="480" class="box-subtext" text-anchor="middle">Git Repository</text>

  <rect x="100" y="540" width="200" height="80" class="box-blue" />
  <text x="200" y="575" class="box-text" text-anchor="middle">Directory Path</text>
  <text x="200" y="600" class="box-subtext" text-anchor="middle">Local Filesystem</text>

  <rect x="100" y="720" width="200" height="80" class="box-purple" filter="url(#glow-purple)" />
  <text x="200" y="755" class="box-text" text-anchor="middle">CodebaseLoader</text>
  <text x="200" y="780" class="box-subtext" text-anchor="middle">AST Parsing &amp; Extraction</text>

  <!-- LAYER 2: INGESTION LAYER -->
  <rect x="380" y="200" width="240" height="660" class="layer-bg" />
  <text x="500" y="240" class="layer-title" text-anchor="middle">Ingestion</text>

  <rect x="400" y="420" width="200" height="80" class="box-purple" />
  <text x="500" y="455" class="box-text" text-anchor="middle">CodebaseParser</text>
  <text x="500" y="480" class="box-subtext" text-anchor="middle">Symbol &amp; Entity Resolution</text>

  <rect x="400" y="560" width="200" height="80" class="box-blue" />
  <text x="500" y="595" class="box-text" text-anchor="middle">Graph Builder</text>
  <text x="500" y="620" class="box-subtext" text-anchor="middle">Knowledge Triples</text>

  <rect x="400" y="680" width="200" height="80" class="box-green" />
  <text x="500" y="715" class="box-text" text-anchor="middle">Vector Embedder</text>
  <text x="500" y="740" class="box-subtext" text-anchor="middle">Text to Vectors</text>

  <!-- LAYER 3: STORAGE LAYER -->
  <rect x="680" y="200" width="240" height="660" class="layer-bg" />
  <text x="800" y="240" class="layer-title" text-anchor="middle">Storage</text>

  <rect x="700" y="420" width="200" height="100" class="box-orange" filter="url(#glow-purple)" />
  <text x="800" y="460" class="box-text" text-anchor="middle">TigerGraph</text>
  <text x="800" y="485" class="box-subtext" text-anchor="middle">Primary Graph DB</text>

  <rect x="700" y="540" width="200" height="80" class="box-orange" stroke-dasharray="4" />
  <text x="800" y="575" class="box-text" text-anchor="middle">SQLite</text>
  <text x="800" y="600" class="box-subtext" text-anchor="middle">Fallback Graph DB</text>

  <rect x="700" y="680" width="200" height="80" class="box-green" filter="url(#glow-green)" />
  <text x="800" y="715" class="box-text" text-anchor="middle">FAISS Store</text>
  <text x="800" y="740" class="box-subtext" text-anchor="middle">Vector Index</text>

  <!-- LAYER 4: QUERY LAYER -->
  <rect x="980" y="200" width="340" height="660" class="layer-bg" />
  <text x="1150" y="240" class="layer-title" text-anchor="middle">Query &amp; Routing</text>

  <rect x="1050" y="300" width="200" height="60" class="box-blue" filter="url(#glow-blue)" />
  <text x="1150" y="335" class="box-text" text-anchor="middle">User Query</text>

  <rect x="1050" y="400" width="200" height="60" class="box-purple" />
  <text x="1150" y="435" class="box-text" text-anchor="middle">QueryClassifier</text>

  <!-- 3-Tier Router -->
  <rect x="1000" y="500" width="300" height="260" fill="rgba(0,0,0,0.3)" stroke="#8892b0" stroke-width="1" rx="8" />
  <text x="1150" y="525" class="box-subtext" text-anchor="middle">3-Tier Router</text>

  <rect x="1020" y="540" width="260" height="50" class="box-green" />
  <text x="1150" y="570" class="box-text" text-anchor="middle">GRAPH_ONLY (&lt;50ms)</text>

  <rect x="1020" y="610" width="260" height="50" class="box-blue" />
  <text x="1150" y="640" class="box-text" text-anchor="middle">GRAPH_RAG (~500t)</text>

  <rect x="1020" y="680" width="260" height="50" class="box-purple" />
  <text x="1150" y="710" class="box-text" text-anchor="middle">LLM_FULL (Full Context)</text>

  <!-- LAYER 5: EVALUATION LAYER -->
  <rect x="1380" y="200" width="200" height="660" class="layer-bg" />
  <text x="1480" y="240" class="layer-title" text-anchor="middle">Evaluation</text>

  <rect x="1400" y="500" width="160" height="80" class="box-orange" />
  <text x="1480" y="535" class="box-text" text-anchor="middle">LLM-as-a-Judge</text>
  <text x="1480" y="560" class="box-subtext" text-anchor="middle">Semantic Eval</text>

  <rect x="1400" y="610" width="160" height="80" class="box-green" />
  <text x="1480" y="645" class="box-text" text-anchor="middle">BERTScore</text>
  <text x="1480" y="670" class="box-subtext" text-anchor="middle">Accuracy Metrics</text>

  <!-- LAYER 6: PRESENTATION LAYER -->
  <rect x="1640" y="200" width="200" height="660" class="layer-bg" />
  <text x="1740" y="240" class="layer-title" text-anchor="middle">Presentation</text>

  <rect x="1660" y="500" width="160" height="190" class="box-blue" filter="url(#glow-blue)" />
  <text x="1740" y="570" class="box-text" text-anchor="middle">React Dashboard</text>
  <text x="1740" y="600" class="box-subtext" text-anchor="middle">Pipeline</text>
  <text x="1740" y="620" class="box-subtext" text-anchor="middle">Comparison</text>

  <!-- ================= PATHS & ARROWS ================= -->

  <!-- Input to Loader -->
  <path d="M 300 340 L 340 340 L 340 760 L 300 760" class="path-line" />
  <path d="M 300 460 L 340 460 L 340 760" class="path-line" />
  <path d="M 300 580 L 340 580 L 340 760" class="path-line" />

  <!-- Loader to Parser -->
  <path d="M 300 760 C 350 760, 350 460, 400 460" class="path-blue" />

  <!-- Parser to Builder & Embedder -->
  <path d="M 500 500 L 500 560" class="path-blue" />
  <path d="M 500 640 L 500 680" class="path-blue" />

  <!-- Builder to Storage -->
  <path d="M 600 600 L 660 600 L 660 470 L 700 470" class="path-purple" />
  <path d="M 660 600 L 660 580 L 700 580" class="path-purple" />
  
  <!-- Embedder to Storage -->
  <path d="M 600 720 L 700 720" class="path-green" />

  <!-- Query Flow -->
  <path d="M 1150 360 L 1150 400" class="path-line" />
  <path d="M 1150 460 L 1150 500" class="path-line" />

  <!-- Router to DB -->
  <path d="M 1020 565 C 950 565, 950 470, 900 470" class="path-purple" stroke-dasharray="8,4" />
  <path d="M 1020 635 C 950 635, 950 720, 900 720" class="path-green" stroke-dasharray="8,4" />

  <!-- DB to Router/Eval -->
  <path d="M 1280 565 C 1340 565, 1340 540, 1400 540" class="path-line" />
  <path d="M 1280 635 C 1340 635, 1340 650, 1400 650" class="path-line" />
  <path d="M 1280 705 C 1360 705, 1360 650, 1400 650" class="path-line" />

  <!-- Eval to Presentation -->
  <path d="M 1560 540 L 1660 540" class="path-blue" />
  <path d="M 1560 650 L 1660 650" class="path-blue" />

  <!-- ================= LEGEND ================= -->
  <rect x="80" y="920" width="1760" height="80" class="layer-bg" />
  <text x="120" y="965" class="layer-title">Tiers</text>
  
  <rect x="250" y="945" width="20" height="20" class="box-green" />
  <text x="280" y="960" class="box-text">GRAPH_ONLY</text>
  <text x="280" y="980" class="box-subtext">0 tokens, pure graph traversal, extremely fast</text>
  
  <rect x="750" y="945" width="20" height="20" class="box-blue" />
  <text x="780" y="960" class="box-text">GRAPH_RAG</text>
  <text x="780" y="980" class="box-subtext">~500 tokens, graph context + LLM synthesis</text>
  
  <rect x="1250" y="945" width="20" height="20" class="box-purple" />
  <text x="1280" y="960" class="box-text">LLM_FULL</text>
  <text x="1280" y="980" class="box-subtext">Full context window, fallback for complex queries</text>

</svg>