[project]
name = "graphmind"
version = "0.1.0"
description = "Token-efficient code reasoning engine with 3-tier smart routing"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GraphMind Team", email = "team@graphmind.ai"}
]
readme = "README.md"
keywords = ["ai", "code-analysis", "graph-database", "rag", "llm", "token-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.32.0,<0.33.0",
    "pydantic>=2.9.0,<3.0.0",
    "tree-sitter>=0.23.0,<1.0.0",
    "tree-sitter-python>=0.23.0,<1.0.0",
    "gitpython>=3.1.0,<4.0.0",
    "tiktoken>=0.8.0,<1.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
ml = [
    "sentence-transformers>=3.0.0",
]
dashboard = [
    "react>=18.0.0",
    "vite>=5.0.0",
    "chart.js>=4.0.0",
    "react-chartjs-2>=5.0.0",
    "cytoscape>=3.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"