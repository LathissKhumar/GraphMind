[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmind"
version = "0.1.0"
description = "CodeGraphX/GraphMind Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.32.0,<0.33.0",
    "pydantic>=2.9.0",
    "networkx>=3.4.0,<3.5.0",
    "tree-sitter>=0.23.0,<0.24.0",
    "tree-sitter-python>=0.23.0,<0.24.0",
    "gitpython>=3.1.0,<3.2.0",
    "tiktoken>=0.8.0,<0.9.0",
    "python-multipart"
]
