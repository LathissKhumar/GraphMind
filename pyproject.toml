[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraphx"
version = "0.0.0"
description = "GraphMind - token-efficient code reasoning engine"
authors = [ {name = "GraphMind"} ]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "pydantic==2.9.0",
    "networkx==3.4.0",
    "GitPython==3.1.0",
    # removed: python-multipart (not imported anywhere)
    "huggingface-hub>=0.20.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "bert-score>=0.3.0",
    "tiktoken>=0.5.0",
    # removed: pyyaml (dead config loader code removed; not imported anywhere)
    "pyTigerGraph>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
codegraphx = "src.api.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=html"
